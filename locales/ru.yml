autoScan:
  label: Сканировать автоматически при переключении вкладок
  note: "Нужен доступ ко всем сайтам."
  offer:
    title: "Сканировать магазины без нажатия?"
    body: "Вкладки сканируются при переключении, а значок отмечает магазины Shopify. Нужен доступ ко всем сайтам."
    accept: "Включить"
    dismiss: "Нет, спасибо"
shortcut:
  label: "Сочетание клавиш"
  none: "Сочетание клавиш не задано"
  change: "Изменить или отключить"
  set: "Задать"
terminal:
  notShopify:
    code: совпадений нет
    title: Это не магазин Shopify.
    body: Страница сверена с каталогом, совпадений нет. Ничего о странице не сохранено.
    hint: "На headless-магазинах и ещё загружающихся страницах Shopify может не определиться."
    action: Сканировать снова
  cantScan:
    code: страница недоступна
    title: Эту страницу нельзя сканировать.
    body: Страницы браузера, Web Store и PDF закрыты для расширений. Откройте вкладку с витриной и попробуйте там.
  error:
    code: сеть
    title: Не удалось связаться с детектором.
    body: "Наш сервер не ответил. Проверьте подключение и повторите попытку."
    action: Повторить
  offline:
    code: офлайн
    title: Нет подключения к сети.
    body: "Подключитесь к сети и повторите попытку."
    action: Повторить
  timeout:
    code: тайм-аут
    title: Детектор слишком долго не отвечал.
    body: "Наш сервер не ответил вовремя. Повторите попытку чуть позже."
    action: Повторить
  serverError:
    code: сервер
    title: У детектора возникла проблема.
    body: "Проблема на нашей стороне, а не у этого магазина. Повторите попытку чуть позже."
    action: Повторить
  rateLimited:
    code: "429"
    title: Подождите немного и попробуйте снова.
    body: Слишком много сканирований за короткое время. Лимит сбросится автоматически.
    action: Повторить
  wait: Повторить можно будет $1.
  needsPermission:
    code: разрешение
    title: Откройте Stackpeek в этом магазине.
    body: Нажмите значок Stackpeek на панели инструментов, чтобы сканировать страницу. Браузер даёт доступ по одному магазину, поэтому боковая панель не может сделать это сама.
    shortcut: "Сочетание клавиш $1 делает то же самое."
    hint: "Или сканируйте без нажатия:"
  ours:
    code: это мы
    title: Вы направили детектор на сам детектор.
    body: Не Shopify. Rails и Postgres на сервере DigitalOcean, а ещё один аналитический маяк — единственный сторонний скрипт на странице. Для себя исключений не делаем.
    action: Сканировать снова

