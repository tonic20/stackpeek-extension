formatLocale: ru-RU
extName: "Shopify Theme Detector & Apps - Stackpeek"
extDescription: "Детектор тем Shopify, детектор приложений и проверка пикселей: узнайте, что использует магазин. Экспорт в CSV."
actionTitle: Определить тему и приложения магазина

panel:
  scanning: Сканирование…
  rescan: Сканировать страницу снова
  rate: Оценить
  feedback: Отзыв
  held: По-прежнему показан $1 — открытая вами страница не сканируется.
theme:
  heading: Тема
  headless: Headless-витрина
  custom: Индивидуальная тема
  unknown: Неизвестная тема
  customized: изменена
  free: Бесплатно
  storeTheme: тема из магазина
  forkedFrom: Создана на основе $1 и изменена.
  customNote: Создана для этого магазина — совпадений в каталоге нет.
  headlessNote: Тему определить нельзя — витрина отделена от слоя тем Shopify.
  # The theme's provenance, shown in the section's own corner slot. The API
  # sends this as an enum ("catalog"/"forked"/"custom"/"headless") and the panel
  # rendered the raw value, so this one word stayed English in every locale.
  origin:
    catalog: каталог
    forked: форк
    custom: на заказ
    headless: headless

apps:
  heading: Приложения
  unverified: не подтверждено
  unverifiedTitle: Совпадение цифрового отпечатка с меньшей уверенностью
  unverifiedSr: — совпадение цифрового отпечатка с меньшей уверенностью
  unverifiedNote: не подтверждено — совпадение по более слабому сигналу. Показано, чтобы вы могли оценить его сами.
# The server's app-category taxonomy. The detect API sends each app's English
# category name AND its slug; the panel groups on the slug and looks the label
# up here, so the group headings translate with the rest of the UI instead of
# staying English inside an otherwise localized panel.
#
# Keys are the slug in camelCase because a Chrome message name cannot contain
# a hyphen. lib/categories.ts maps slug -> key and falls back to the server's
# English name for any slug missing here, so a category added after this ships
# degrades to English rather than rendering a blank heading.
