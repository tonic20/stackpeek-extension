formatLocale: es
extName: Shopify Theme Detector & Apps - Stackpeek
extDescription: Descubre al instante tema, apps y rastreadores de cualquier tienda Shopify. Exporta CSV. Permisos mínimos, sin guardar historial.
actionTitle: Detectar el tema y las apps de esta tienda

panel:
  scanning: Analizando…
  rescan: Volver a analizar esta página
  privacy: Privacidad
  held: Se sigue mostrando $1; la ficha que abriste no se ha analizado.
theme:
  heading: Tema
  headless: Tienda headless
  custom: Tema a medida
  unknown: Tema desconocido
  customized: personalizado
  free: Gratis
  storeTheme: tema de la tienda
  forkedFrom: Derivado de $1 y modificado.
  customNote: Creado para esta tienda; no coincide con el catálogo.
  headlessNote: No se puede detectar el tema; la tienda está desacoplada de la capa de temas de Shopify.
  # The theme's provenance, shown in the section's own corner slot. The API
  # sends this as an enum ("catalog"/"forked"/"custom"/"headless") and the panel
  # rendered the raw value, so this one word stayed English in every locale.
  origin:
    catalog: catálogo
    forked: bifurcado
    custom: personalizado
    headless: headless

apps:
  heading: Apps
  unverified: sin verificar
  unverifiedTitle: Coincidencia de huella con menor confianza
  unverifiedSr: — coincidencia de huella con menor confianza
  unverifiedNote: sin verificar — coincidencia basada en una señal más débil. Se muestra para que puedas valorarla.
# The server's app-category taxonomy. The detect API sends each app's English
# category name AND its slug; the panel groups on the slug and looks the label
# up here, so the group headings translate with the rest of the UI instead of
# staying English inside an otherwise localized panel.
#
# Keys are the slug in camelCase because a Chrome message name cannot contain
# a hyphen. lib/categories.ts maps slug -> key and falls back to the server's
# English name for any slug missing here, so a category added after this ships
# degrades to English rather than rendering a blank heading.
