terminal:
  notShopify:
    code: sin coincidencia
    title: No es una tienda Shopify.
    body: Se comparó con el catálogo y no hubo coincidencias. No se guardó nada de la página.
    action: Analizar de nuevo
  cantScan:
    code: página ilegible
    title: No se puede analizar esta página.
    body: Las páginas del navegador, Web Store y los PDF están cerrados a las extensiones. Abre una pestaña de una tienda e inténtalo allí.
  error:
    code: red
    title: No se pudo contactar con el detector.
    body: Se leyeron las señales de la página, pero la API no respondió. No se guardó nada.
    action: Reintentar
  rateLimited:
    code: "429"
    title: Espera un momento e inténtalo de nuevo.
    body: Demasiados análisis en poco tiempo. El límite se restablece solo.
    action: Reintentar
  needsPermission:
    code: permiso
    title: Abre Stackpeek en esta tienda.
    body: Haz clic en el icono de Stackpeek de la barra para analizar esta página. El navegador concede acceso a una tienda cada vez, por eso el panel no puede hacerlo por ti.
  ours:
    code: somos nosotros
    title: Has apuntado el detector hacia el propio detector.
    body: No es Shopify. Rails y Postgres en un servidor de DigitalOcean, más una baliza analítica, el único script de terceros de la página. No nos damos trato especial.
    action: Analizar de nuevo
