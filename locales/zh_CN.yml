terminal:
  notShopify:
    code: 无匹配项
    title: 这不是 Shopify 商店。
    body: 已与目录比对，但没有匹配项。未存储任何页面信息。
    hint: "在无头商店或仍在加载的页面上，可能检测不到 Shopify。"
    action: 重新扫描
  cantScan:
    code: 页面无法读取
    title: 无法扫描此页面。
    body: 浏览器页面、Web Store 和 PDF 不允许扩展程序访问。请打开店面标签页后重试。
  error:
    code: 网络
    title: 无法连接检测服务。
    body: "我们的服务器未响应。请检查网络连接后重试。"
    action: 重试
  offline:
    code: 离线
    title: 你已离线。
    body: "请恢复网络连接后重试。"
    action: 重试
  timeout:
    code: 超时
    title: 检测服务响应时间过长。
    body: "我们的服务器未能及时响应。请稍后重试。"
    action: 重试
  serverError:
    code: 服务器
    title: 检测服务出现问题。
    body: "问题出在我们这边，而不是这家商店。请稍后重试。"
    action: 重试
  rateLimited:
    code: "429"
    title: 请稍后再试。
    body: 短时间内扫描次数过多。限额会自动重置。
    action: 重试
  wait: $1可重试。
  needsPermission:
    code: 权限
    title: 请在此商店中打开 Stackpeek。
    body: 点击工具栏中的 Stackpeek 图标以扫描此页面。浏览器每次只授权访问一家商店，因此面板无法代你执行。
    shortcut: "快捷键 $1 也能做到。"
    hint: "或者无需点击即可扫描："
  ours:
    code: 这是我们
    title: 你让检测器检测了自己。
    body: 不是 Shopify。它是在 DigitalOcean 服务器上运行的 Rails 和 Postgres，另有一个分析信标，是页面唯一的第三方脚本。我们不会把自己排除在外。
    action: 重新扫描

