formatLocale: zh-CN
extName: "Shopify Theme Detector & Apps - Stackpeek"
extDescription: "用这款 Shopify 主题检测器，查看店铺的主题、应用和跟踪器。集应用检测器与像素检查器于一体，支持 CSV 导出。"
actionTitle: 检测此商店的主题和应用

