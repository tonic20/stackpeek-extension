terminal:
  notShopify:
    code: 일치 없음
    title: Shopify 스토어가 아닙니다.
    body: 카탈로그와 대조했지만 일치하지 않았습니다. 페이지에 관한 정보는 저장되지 않았습니다.
    hint: "헤드리스 스토어나 로딩 중인 페이지에서는 Shopify를 감지하지 못할 수 있습니다."
    action: 다시 스캔
  cantScan:
    code: 읽을 수 없는 페이지
    title: 이 페이지를 스캔할 수 없습니다.
    body: 브라우저 페이지, Web Store, PDF에는 확장 프로그램이 접근할 수 없습니다. 스토어프론트 탭을 열고 다시 시도하세요.
  error:
    code: 네트워크
    title: 탐지기에 연결할 수 없습니다.
    body: "서버가 응답하지 않았습니다. 연결을 확인한 후 다시 시도하세요."
    action: 다시 시도
  offline:
    code: 오프라인
    title: 오프라인 상태입니다.
    body: "다시 연결한 후 다시 시도하세요."
    action: 다시 시도
  timeout:
    code: 시간 초과
    title: "감지 서비스의 응답이 너무 늦습니다."
    body: "서버가 제시간에 응답하지 않았습니다. 잠시 후 다시 시도하세요."
    action: 다시 시도
  serverError:
    code: 서버
    title: "감지 서비스에 문제가 생겼습니다."
    body: "이 스토어가 아니라 저희 쪽 문제입니다. 잠시 후 다시 시도하세요."
    action: 다시 시도
  rateLimited:
    code: "429"
    title: 잠시 기다린 후 다시 시도하세요.
    body: 짧은 시간에 너무 많이 스캔했습니다. 한도는 자동으로 초기화됩니다.
    action: 다시 시도
  wait: $1에 다시 시도할 수 있습니다.
  needsPermission:
    code: 권한
    title: 이 스토어에서 Stackpeek을 여세요.
    body: 이 페이지를 스캔하려면 도구 모음의 Stackpeek 아이콘을 클릭하세요. 브라우저는 한 번에 한 스토어에만 접근을 허용하므로 패널이 대신 실행할 수 없습니다.
    shortcut: "단축키 $1로도 같은 작업을 할 수 있습니다."
    hint: "또는 클릭 없이 스캔:"
  ours:
    code: 바로 우리입니다
    title: 탐지기로 탐지기 자체를 가리켰습니다.
    body: Shopify가 아닙니다. DigitalOcean 서버의 Rails와 Postgres, 그리고 페이지의 유일한 외부 스크립트인 분석 비콘 하나입니다. 우리 자신도 예외로 두지 않습니다.
    action: 다시 스캔

