    code: ネットワーク
    title: 検出サービスに接続できませんでした。
    body: ページのシグナルは読み取りましたが、APIから応答がありませんでした。何も保存されていません。
    action: 再試行
  rateLimited:
    code: "429"
    title: 少し待ってからもう一度お試しください。
    body: 短時間にスキャンが集中しました。制限は自動的に解除されます。
    action: 再試行
  needsPermission:
    code: 権限
    title: このストアでStackpeekを開いてください。
    body: ツールバーのStackpeekアイコンをクリックしてこのページをスキャンしてください。ブラウザは一度に1ストアずつアクセスを許可するため、パネルからは実行できません。
  ours:
    code: Stackpeekです
    title: 検出ツール自身を検出しようとしています。
    body: Shopifyではありません。DigitalOcean上のRailsとPostgresに加え、ページ唯一の外部スクリプトである分析ビーコンがあります。自社サイトも例外にしません。
    action: もう一度スキャン
