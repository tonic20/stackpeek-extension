terminal:
  notShopify:
    code: कोई मेल नहीं
    title: यह Shopify स्टोर नहीं है।
    body: कैटलॉग से जाँच की गई और कोई मेल नहीं मिला। पेज के बारे में कुछ भी संग्रहीत नहीं हुआ।
    hint: "हेडलेस स्टोर या लोड हो रहे पेज पर Shopify शायद पहचाना न जाए।"
    action: फिर स्कैन करें
  cantScan:
    code: पेज पढ़ा नहीं जा सकता
    title: यह पेज स्कैन नहीं किया जा सकता।
    body: ब्राउज़र पेज, Web Store और PDF एक्सटेंशन के लिए बंद हैं। किसी स्टोरफ़्रंट का टैब खोलकर वहाँ कोशिश करें।
  error:
    code: नेटवर्क
    title: डिटेक्टर तक नहीं पहुँचा जा सका।
    body: "हमारे सर्वर ने जवाब नहीं दिया। अपना कनेक्शन जाँचें, फिर कोशिश करें।"
    action: फिर कोशिश करें
  offline:
    code: ऑफ़लाइन
    title: आप ऑफ़लाइन हैं।
    body: "फिर से कनेक्ट करें, फिर कोशिश करें।"
    action: फिर कोशिश करें
  timeout:
    code: समय समाप्त
    title: डिटेक्टर ने बहुत देर लगाई।
    body: "हमारे सर्वर ने समय पर जवाब नहीं दिया। थोड़ी देर में फिर कोशिश करें।"
    action: फिर कोशिश करें
  serverError:
    code: सर्वर
    title: डिटेक्टर में कोई समस्या आई।
    body: "गड़बड़ी हमारी ओर से है, इस स्टोर की नहीं। थोड़ी देर में फिर कोशिश करें।"
    action: फिर कोशिश करें
  rateLimited:
    code: "429"
    title: थोड़ा रुककर फिर कोशिश करें।
    body: कम समय में बहुत अधिक स्कैन हुए। सीमा अपने आप रीसेट हो जाएगी।
    action: फिर कोशिश करें
  wait: आप $1 फिर कोशिश कर सकेंगे।
  needsPermission:
    code: अनुमति
    title: इस स्टोर पर Stackpeek खोलें।
    body: इस पेज को स्कैन करने के लिए टूलबार में Stackpeek आइकन पर क्लिक करें। ब्राउज़र एक बार में एक स्टोर की अनुमति देता है, इसलिए पैनल यह आपके लिए नहीं कर सकता।
    shortcut: "शॉर्टकट $1 भी यही करता है।"
    hint: "या बिना क्लिक किए स्कैन करें:"
  ours:
    code: यह हम हैं
    title: आपने डिटेक्टर को उसी की ओर कर दिया।
    body: Shopify नहीं। DigitalOcean सर्वर पर Rails और Postgres — साथ में एक analytics beacon, जो पेज पर एकमात्र तृतीय-पक्ष स्क्रिप्ट है। हम खुद को छूट नहीं देते।
    action: फिर स्कैन करें

