terminal:
  notShopify:
    code: không khớp
    title: Không phải cửa hàng Shopify.
    body: Đã đối chiếu với danh mục nhưng không khớp. Không có dữ liệu nào của trang được lưu.
    hint: "Có thể không phát hiện được Shopify trên cửa hàng headless hoặc trang đang tải."
    action: Quét lại
  cantScan:
    code: trang không đọc được
    title: Không thể quét trang này.
    body: Trang của trình duyệt, Web Store và tệp PDF không cho tiện ích truy cập. Hãy mở một tab cửa hàng rồi thử tại đó.
  error:
    code: mạng
    title: Không thể kết nối với trình dò.
    body: "Máy chủ của chúng tôi không phản hồi. Hãy kiểm tra kết nối rồi thử lại."
    action: Thử lại
  offline:
    code: ngoại tuyến
    title: Bạn đang ngoại tuyến.
    body: "Hãy kết nối lại rồi thử lại."
    action: Thử lại
  timeout:
    code: hết thời gian
    title: "Trình dò phản hồi quá chậm."
    body: "Máy chủ của chúng tôi không phản hồi kịp. Hãy thử lại sau giây lát."
    action: Thử lại
  serverError:
    code: máy chủ
    title: Trình dò gặp sự cố.
    body: "Lỗi ở phía chúng tôi, không phải cửa hàng này. Hãy thử lại sau giây lát."
    action: Thử lại
  rateLimited:
    code: "429"
    title: Vui lòng chờ một chút rồi thử lại.
    body: Có quá nhiều lượt quét trong thời gian ngắn. Giới hạn sẽ tự đặt lại.
    action: Thử lại
  wait: Bạn có thể thử lại $1.
  needsPermission:
    code: quyền truy cập
    title: Mở Stackpeek trên cửa hàng này.
    body: Nhấp biểu tượng Stackpeek trên thanh công cụ để quét trang. Trình duyệt chỉ cấp quyền cho từng cửa hàng, vì vậy bảng điều khiển không thể tự làm thay bạn.
    shortcut: "Phím tắt $1 cũng làm như vậy."
    hint: "Hoặc quét mà không cần nhấp:"
  ours:
    code: chính là chúng tôi
    title: Bạn đã hướng trình dò vào chính nó.
    body: Không phải Shopify. Rails và Postgres trên máy chủ DigitalOcean — cùng một beacon phân tích, tập lệnh bên thứ ba duy nhất trên trang. Chúng tôi không tự miễn trừ.
    action: Quét lại

