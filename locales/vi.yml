  rescan: Quét lại trang này
  rate: Đánh giá
  feedback: Góp ý
  held: Vẫn đang hiển thị $1 — trang bạn vừa mở chưa được quét.
theme:
  heading: Giao diện
  headless: Cửa hàng headless
  custom: Giao diện tùy chỉnh
  unknown: Giao diện không xác định
  customized: đã tùy biến
  free: Miễn phí
