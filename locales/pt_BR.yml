formatLocale: pt-BR
extName: Shopify Theme Detector & Apps - Stackpeek
extDescription: Veja na hora tema, apps e rastreadores de qualquer loja Shopify. Exporte CSV. Rápido, poucas permissões e sem salvar histórico.
actionTitle: Detectar tema e apps desta loja

panel:
  scanning: Analisando…
  rescan: Analisar esta página novamente
  privacy: Privacidade
  held: Ainda exibindo $1 — a página que você abriu não foi analisada.
theme:
  heading: Tema
  headless: Loja headless
  custom: Tema sob medida
  unknown: Tema desconhecido
  customized: personalizado
  free: Grátis
  storeTheme: tema da loja
  forkedFrom: Derivado de $1 e modificado.
  customNote: Criado para esta loja — sem correspondência no catálogo.
  headlessNote: Tema não detectável — a loja está separada da camada de temas da Shopify.
  # The theme's provenance, shown in the section's own corner slot. The API
  # sends this as an enum ("catalog"/"forked"/"custom"/"headless") and the panel
  # rendered the raw value, so this one word stayed English in every locale.
  origin:
    catalog: catálogo
    forked: derivado
    custom: personalizado
    headless: headless

apps:
  heading: Apps
  unverified: não verificado
  unverifiedTitle: Correspondência de impressão digital menos confiável
  unverifiedSr: — correspondência de impressão digital menos confiável
  unverifiedNote: não verificado — correspondência baseada em um sinal mais fraco. Exibida para você avaliar.
# The server's app-category taxonomy. The detect API sends each app's English
# category name AND its slug; the panel groups on the slug and looks the label
# up here, so the group headings translate with the rest of the UI instead of
# staying English inside an otherwise localized panel.
#
# Keys are the slug in camelCase because a Chrome message name cannot contain
# a hyphen. lib/categories.ts maps slug -> key and falls back to the server's
# English name for any slug missing here, so a category added after this ships
# degrades to English rather than rendering a blank heading.
