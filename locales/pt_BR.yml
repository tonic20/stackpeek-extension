terminal:
  notShopify:
    code: sem correspondência
    title: Não é uma loja Shopify.
    body: A página foi comparada ao catálogo e não houve correspondência. Nada dela foi armazenado.
    hint: "O Shopify pode não ser detectado em lojas headless ou páginas ainda carregando."
    action: Analisar novamente
  cantScan:
    code: página ilegível
    title: Não é possível analisar esta página.
    body: Páginas do navegador, a Web Store e PDFs são bloqueados para extensões. Abra uma aba de loja e tente nela.
  error:
    code: rede
    title: Não foi possível acessar o detector.
    body: "Nosso servidor não respondeu. Verifique sua conexão e tente novamente."
    action: Tentar novamente
  offline:
    code: offline
    title: Você está offline.
    body: "Reconecte-se e tente novamente."
    action: Tentar novamente
  timeout:
    code: tempo esgotado
    title: O detector demorou demais.
    body: "Nosso servidor não respondeu a tempo. Tente novamente em instantes."
    action: Tentar novamente
  serverError:
    code: servidor
    title: O detector teve um problema.
    body: "A falha é nossa, não desta loja. Tente novamente em instantes."
    action: Tentar novamente
  rateLimited:
    code: "429"
    title: Aguarde um pouco e tente de novo.
    body: Análises demais em pouco tempo. O limite é redefinido automaticamente.
    action: Tentar novamente
  wait: Você poderá tentar de novo $1.
  needsPermission:
    code: permissão
    title: Abra o Stackpeek nesta loja.
    body: Clique no ícone do Stackpeek na barra de ferramentas para analisar esta página. O navegador concede acesso a uma loja por vez, por isso o painel não pode fazer isso por você.
    shortcut: "O atalho $1 faz o mesmo."
    hint: "Ou analise sem clicar:"
  ours:
    code: somos nós
    title: Você apontou o detector para ele mesmo.
    body: Não é Shopify. Rails e Postgres em um servidor da DigitalOcean, mais um beacon de análise, o único script de terceiros da página. Não abrimos exceção para nós mesmos.
    action: Analisar novamente

