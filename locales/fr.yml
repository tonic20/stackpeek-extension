formatLocale: fr-FR
extName: Détecteur de thèmes et apps Shopify — Stackpeek
extDescription: Identifiez aussitôt le thème, les apps et les traceurs d’une boutique Shopify. Export CSV, rapide et permissions minimales.
actionTitle: Détecter le thème et les apps de cette boutique

panel:
  scanning: Analyse en cours…
  rescan: Analyser à nouveau cette page
  privacy: Confidentialité
  held: Affichage maintenu sur $1 — la fiche ouverte n’est pas analysée.
theme:
  heading: Thème
  headless: Boutique headless
  custom: Thème sur mesure
  unknown: Thème inconnu
  customized: personnalisé
  free: Gratuit
  storeTheme: thème de la boutique
  forkedFrom: Dérivé de $1 puis modifié.
  customNote: Créé pour cette boutique — aucune correspondance dans le catalogue.
  headlessNote: Thème indétectable — la boutique est dissociée de la couche de thèmes de Shopify.
  # The theme's provenance, shown in the section's own corner slot. The API
  # sends this as an enum ("catalog"/"forked"/"custom"/"headless") and the panel
  # rendered the raw value, so this one word stayed English in every locale.
  origin:
    catalog: catalogue
    forked: dérivé
    custom: sur mesure
    headless: headless

apps:
  heading: Apps
  unverified: non vérifié
  unverifiedTitle: Correspondance d’empreinte moins fiable
  unverifiedSr: — correspondance d’empreinte moins fiable
  unverifiedNote: non vérifié — correspondance fondée sur un signal plus faible. Affichée pour vous laisser l’évaluer.
# The server's app-category taxonomy. The detect API sends each app's English
# category name AND its slug; the panel groups on the slug and looks the label
# up here, so the group headings translate with the rest of the UI instead of
# staying English inside an otherwise localized panel.
#
# Keys are the slug in camelCase because a Chrome message name cannot contain
# a hyphen. lib/categories.ts maps slug -> key and falls back to the server's
# English name for any slug missing here, so a category added after this ships
# degrades to English rather than rendering a blank heading.
