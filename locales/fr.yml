terminal:
  notShopify:
    code: aucune correspondance
    title: Ce n’est pas une boutique Shopify.
    body: Comparaison au catalogue effectuée sans résultat. Aucune donnée de la page n’a été stockée.
    action: Analyser à nouveau
  cantScan:
    code: page illisible
    title: Impossible d’analyser cette page.
    body: Les pages du navigateur, le Web Store et les PDF sont inaccessibles aux extensions. Ouvrez l’onglet d’une boutique et réessayez.
  error:
    code: réseau
    title: Impossible de joindre le détecteur.
    body: Les signaux de la page ont été lus, mais l’API n’a pas répondu. Rien n’a été stocké.
    action: Réessayer
  rateLimited:
    code: "429"
    title: Patientez un instant avant de réessayer.
    body: Trop d’analyses sur une courte période. La limite se réinitialise automatiquement.
    action: Réessayer
  needsPermission:
    code: autorisation
    title: Ouvrez Stackpeek sur cette boutique.
    body: Cliquez sur l’icône Stackpeek dans la barre d’outils pour analyser cette page. Le navigateur accorde l’accès à une boutique à la fois, le panneau ne peut donc pas le faire à votre place.
  ours:
    code: c’est nous
    title: Vous avez pointé le détecteur vers lui-même.
    body: Pas Shopify. Rails et Postgres sur un serveur DigitalOcean, plus une balise d’analyse, seul script tiers de la page. Nous ne nous exemptons pas.
    action: Analyser à nouveau
