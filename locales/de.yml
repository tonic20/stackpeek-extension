terminal:
  notShopify:
    code: keine Übereinstimmung
    title: Kein Shopify-Shop.
    body: Mit dem Katalog abgeglichen, ohne Treffer. Von der Seite wurde nichts gespeichert.
    action: Erneut analysieren
  cantScan:
    code: Seite nicht lesbar
    title: Diese Seite kann nicht analysiert werden.
    body: Browserseiten, der Web Store und PDFs sind für Erweiterungen gesperrt. Öffne einen Storefront-Tab und versuche es dort.
  error:
    code: Netzwerk
    title: Der Detektor ist nicht erreichbar.
    body: Die Seitensignale wurden gelesen, aber die API antwortete nicht. Nichts wurde gespeichert.
    action: Erneut versuchen
  rateLimited:
    code: "429"
    title: Bitte warte kurz und versuche es erneut.
    body: Zu viele Analysen in kurzer Zeit. Das Limit wird automatisch zurückgesetzt.
    action: Erneut versuchen
  needsPermission:
    code: Berechtigung
    title: Öffne Stackpeek in diesem Shop.
    body: Klicke in der Symbolleiste auf Stackpeek, um diese Seite zu analysieren. Dein Browser erteilt Zugriff jeweils nur für einen Shop; deshalb kann das Panel dies nicht selbst tun.
  ours:
    code: das sind wir
    title: Du hast den Detektor auf den Detektor gerichtet.
    body: Kein Shopify. Rails und Postgres auf einem DigitalOcean-Server — plus ein Analytics-Beacon als einziges Drittanbieter-Skript. Wir nehmen uns nicht aus.
    action: Erneut analysieren
