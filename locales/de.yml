formatLocale: de-DE
extName: Shopify Theme Detector & Apps - Stackpeek
extDescription: Erkennt sofort Theme, Apps und Tracker jedes Shopify-Shops. CSV-Export. Wenige Berechtigungen, speichert nie deinen Verlauf.
actionTitle: Theme und Apps dieses Shops erkennen

panel:
  scanning: Wird analysiert…
  rescan: Seite erneut analysieren
  privacy: Datenschutz
  held: Weiterhin wird $1 angezeigt — die geöffnete Seite wird nicht analysiert.
theme:
  heading: Theme
  headless: Headless-Storefront
  custom: Individuelles Theme
  unknown: Unbekanntes Theme
  customized: angepasst
  free: Kostenlos
  storeTheme: Shop-Theme
  forkedFrom: Von $1 abgeleitet und verändert.
  customNote: Für diesen Shop erstellt — keine Übereinstimmung im Katalog.
  headlessNote: Theme nicht erkennbar — der Storefront ist von Shopifys Theme-Ebene entkoppelt.
  # The theme's provenance, shown in the section's own corner slot. The API
  # sends this as an enum ("catalog"/"forked"/"custom"/"headless") and the panel
  # rendered the raw value, so this one word stayed English in every locale.
  origin:
    catalog: Katalog
    forked: Fork
    custom: individuell
    headless: headless

apps:
  heading: Apps
  unverified: nicht verifiziert
  unverifiedTitle: Fingerprint-Treffer mit geringerer Sicherheit
  unverifiedSr: — Fingerprint-Treffer mit geringerer Sicherheit
  unverifiedNote: nicht verifiziert — anhand eines schwächeren Signals erkannt. Wird zur eigenen Beurteilung angezeigt.
# The server's app-category taxonomy. The detect API sends each app's English
# category name AND its slug; the panel groups on the slug and looks the label
# up here, so the group headings translate with the rest of the UI instead of
# staying English inside an otherwise localized panel.
#
# Keys are the slug in camelCase because a Chrome message name cannot contain
# a hyphen. lib/categories.ts maps slug -> key and falls back to the server's
# English name for any slug missing here, so a category added after this ships
# degrades to English rather than rendering a blank heading.
