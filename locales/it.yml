terminal:
  notShopify:
    code: nessuna corrispondenza
    title: Non è un negozio Shopify.
    body: Confronto con il catalogo senza risultati. Nessun dato della pagina è stato salvato.
    action: Analizza di nuovo
  cantScan:
    code: pagina illeggibile
    title: Impossibile analizzare questa pagina.
    body: Le pagine del browser, il Web Store e i PDF sono inaccessibili alle estensioni. Apri la scheda di un negozio e riprova.
  error:
    code: rete
    title: Impossibile raggiungere il rilevatore.
    body: I segnali della pagina sono stati letti, ma l’API non ha risposto. Nulla è stato salvato.
    action: Riprova
  rateLimited:
    code: "429"
    title: Attendi un momento e riprova.
    body: Troppe analisi in poco tempo. Il limite si azzera automaticamente.
    action: Riprova
  needsPermission:
    code: autorizzazione
    title: Apri Stackpeek su questo negozio.
    body: Fai clic sull’icona Stackpeek nella barra per analizzare la pagina. Il browser concede l’accesso a un negozio alla volta, quindi il pannello non può farlo per te.
  ours:
    code: siamo noi
    title: Hai puntato il rilevatore verso se stesso.
    body: Non Shopify. Rails e Postgres su un server DigitalOcean, più un beacon di analisi, l’unico script di terze parti nella pagina. Non facciamo eccezioni per noi stessi.
    action: Analizza di nuovo
