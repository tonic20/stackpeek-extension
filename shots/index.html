<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Panel shot harness</title>
    <style>
      /* The normal 460px capture sits just above panel.css's 440px container
         breakpoint. Geometry QA also resizes the viewport to 320px, so the
         mount must shrink with it instead of forcing horizontal overflow. */
      html, body { margin: 0; background: #fff; }
      #app { width: 100%; max-width: 460px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
